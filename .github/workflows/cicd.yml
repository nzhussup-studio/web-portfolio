name: Web Portfolio CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

concurrency:
  group: web-portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: portfolio

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: portfolio
          file: portfolio/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            nzhussup/web-portfolio:${{ github.sha }}
            nzhussup/web-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy image and verify rollout
        uses: appleboy/ssh-action@v1.2.4
        env:
          IMAGE: nzhussup/web-portfolio:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE
          script_stop: true
          script: |
            CONTAINER_NAME=$(kubectl get deployment/web-portfolio -o jsonpath='{.spec.template.spec.containers[0].name}')
            test -n "${CONTAINER_NAME}"
            kubectl set image deployment/web-portfolio "${CONTAINER_NAME}=${IMAGE}"
            kubectl rollout status deployment/web-portfolio --timeout=180s
